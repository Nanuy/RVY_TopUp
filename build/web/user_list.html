
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link rel="stylesheet" href="css/user_list.css">
</head>
<body>
     <header>
        <div class="logo">
            <img src="image/logo.png" alt="Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="admin.html">Admin Dashboard</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
        <section class="user-list">
            <h1>User List</h1>
            <form action="users" method="get">
                <input type="hidden" name="action" value="list">
                <input type="text" name="search" placeholder="Search...">
                <button type="submit" class="btn edit-btn">Search</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th><a href="users?action=list&sort=id" class="atas">ID</a></th>
                        <th><a href="users?action=list&sort=username" class="atas">Username</a></th>
                        <th><a href="users?action=list&sort=email" class="atas">Email</a></th>
                        <th><a href="users?action=list&sort=status" class="atas">Status</a></th>
                        <th class="atas">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td>
                            <a href="" class="btn edit-btn">Edit</a>
                            <a href="" class="btn delete-btn" onclick="return confirm('Are you sure?')">Deactivate</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
       </div>
    </main>
</body>
</html>
