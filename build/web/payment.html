<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success</title>
    <link rel="stylesheet" href="css/paymen_qris.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="image/images.png" alt="Logo">
        </div>
    </header>
    <main>
        <section class="payment">
            <h2>Payment Success</h2>
            <div class="order-summary">
                <h3>Order Summary</h3>
                <div class="summary-item">
                    <span>Username:</span>
                    <span>User</span>
                </div>
                <div class="summary-item">
                    <span>Email:</span>
                    <span>user@example.com</span>
                </div>
                <div class="summary-item">
                    <span>Product Name:</span>
                    <span>Steam Wallet IDR</span>
                </div>
                <div class="summary-item">
                    <span>Price:</span>
                    <span>IDR 100,000</span>
                </div>
                <div class="summary-item">
                    <span>Payment Method:</span>
                    <span>QRIS</span>
                </div>
            </div>
            <div class="success-image">
                <img src="image/Success.jpg" alt="Payment Success">
            </div>
            <div class="button-container">
                <a href="index.html" class="payment-button">Home</a>
            </div>
        </section>
    </main>
</body>
</html>
